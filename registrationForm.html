<!DOCTYPE html>
 <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register here</title>
	 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	 <link rel="stylesheet" type="text/css" href="stl.css">
 </head>
 <body>
  <div class="container">
        <h2>Registration Form</h2>
        <div class="form-container"></div>
		 <form>
            <div class="input-name">
			 <h4>Full Name</h4>
              <i class="fa fa-user"></i>
			  <input type="text" placeholder="First Name" class="name">
			    <span>
				<i class="fa fa-user"></i>
			    <input type="text" placeholder="Last Name" class="name">
			  </span>
			</div>
			
			<div class="input-name">
			 <h3>Mobile Number</h3>
              <i class="fa-solid fa-phone"></i>
			  <input type="mobile no." placeholder="Mobile no." class="text-name">
			</div>

			
			<div class="input-name">
			  <h4>Email id</h4>
			  <i class="fa-solid fa-envelope"></i>
			  <input type="email" placeholder="Email id" class="text-name">
			</div>

			<div class="input-name">
				<h4>Address</h4>
				<i class="fa-solid fa-house-user"></i>
				<input type="address" placeholder="Address" class="text-name">
			  </div>
			
			  <div class="input-name">
				<h4>House no./ Street no.</h4>
				<input type="h no." placeholder="House no./Street no." class="text-name">
			  </div>

			  <div class="input-name">
				<h4>Pincode</h4>
				<input type="pincode" placeholder="Pincode" class="text-name">
			  </div>

			  <div class="input-name">
				<h4>Landmark</h4>
				<i class="fa-solid fa-landmark"></i>
				<input type="landmark" placeholder="Landmark" class="text-name">
			  </div>

		
			
			<div class="input-name">
			 <h4>State</h4>
              <select class="state">
			    <option>Select State</option>
				<option>West Bengal</option>
				<option>Maharastra</option>
				<option>Delhi</option>
				<option>Punjab</option>
                <option>Rajasthan</option>
				<option>Gujrat</option>
				<option>Karnatak</option>
				<option>Assam</option>
			  </select>
			  <div class="arrow"></div>
			</div>

            <div class="input-name">
                <select class="city">
                  <option>Select City</option>
                  <option>Kolkata</option>
                  <option>Mumbai</option>
                  <option>Puna</option>
                  <option>Jodhpur</option>
                  <option>Bengaluru</option>
                </select>
                <div class="arrow"></div>
              </div>
			
			<div class="input-name">
			  <input type="checkbox" id="cb"  class="check-button">
			  <label for="cb" class="check">I accept all the terms and conditions.</label>
			</div>
			
			<div class="input-name">
			  <input type="submit" class="button" value="Register">
			</div>
        </form>
    </div>
 </body>
</html>
