<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist Example</title>
    
</head>
<body>
    <div class="product">
        <h2>Product Name</h2>
        <p>Description of the product...</p>
        <span class="wishlist-icon" onclick="toggleWishlist(this)">❤️</span>
    </div>
    <!-- Add more products as needed -->
    <div class="wishlist">
        <h2>Wishlist</h2>
        <ul id="wishlist-items">
            <!-- Wishlist items will be displayed here -->
        </ul>
    </div>

<style>
	/* styles.css */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

.product {
    padding: 20px;
    border: 1px solid #ddd;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.wishlist-icon {
    font-size: 24px;
    cursor: pointer;
}

.wishlist {
    background-color: #f5f5f5;
    padding: 20px;
    border: 1px solid #ddd;
}

ul {
    list-style: none;
    padding: 0;
}

</style>
    <script >// script.js
const wishlistItems = [];

function toggleWishlist(icon) {
    const product = icon.parentElement;
    const productName = product.querySelector('h2').textContent;

    if (!wishlistItems.includes(productName)) {
        wishlistItems.push(productName);
        addToWishlist(productName);
    } else {
        wishlistItems.splice(wishlistItems.indexOf(productName), 1);
        removeFromWishlist(productName);
    }
}

function addToWishlist(productName) {
    const wishlist = document.getElementById('wishlist-items');
    const li = document.createElement('li');
    li.textContent = productName;
    wishlist.appendChild(li);
}

function removeFromWishlist(productName) {
    const wishlist = document.getElementById('wishlist-items');
    const items = wishlist.getElementsByTagName('li');
    for (let i = 0; i < items.length; i++) {
        if (items[i].textContent === productName) {
            wishlist.removeChild(items[i]);
            break;
        }
    }
}
</script> <!-- Link to your JavaScript file -->
</body>
</html>
