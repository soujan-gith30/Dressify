<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <link rel="stylesheet" href="stdr.css"> <!-- Link to your CSS file -->
</head>
<body>
    <header>
        <!-- Add your website header here -->
    </header>

    <main class="product-page">
        <div class="product-image">
            <img src="product-image.jpg" alt="Product Image">
        </div>
        <div class="product-details">
            <h1 class="product-name">Product Name</h1>
            <p class="product-description">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
            <p class="product-price">$99.99</p>
            <button class="add-to-cart-button" onclick="addToCart()">Add to Cart</button>
        </div>
    </main>

    <footer>
        <!-- Add your website footer here -->
    </footer>

	
    <script src="sc1.js">
</script> <!-- Link to your JavaScript file -->
</body>
</html>
